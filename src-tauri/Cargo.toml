[package]
name = "slimgit"
version = "1.0.1"
description = "A slim SmartGit-like client built on Tauri"
authors = ["you"]
edition = "2021"

[lib]
name = "slimgit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
